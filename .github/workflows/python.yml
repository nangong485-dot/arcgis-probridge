name: Python checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ProBridge/requirements.txt
      - run: python -m pip install -r ProBridge/requirements.txt
      - run: python -m compileall -q ProBridge/client ProBridge/tools ProBridge/scripts ProBridge/agent ProBridge/mcp_server.py
      - run: python ProBridge/tools/mcp_smoke.py
